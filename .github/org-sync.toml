# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
title = "ns3-swarm-core"
module = "swarm-core"
dual = ["core/", "tools/"]
trust_boundary = """
The bounds-checked little-endian readers in `core/` (org invariant 3):
`WireReader` (`core/swarm-wire.h`) and `VisitedPath::read` never read past the
buffer, reject a short or malformed buffer (wrong version byte, bad bool,
oversized count, trailing bytes) and fail closed, with no undefined
behaviour. Roundtrip and seeded fuzz tests in `core/test/test-wire.cc` back
this on every PR, including under ASan and UBSan. Everything above them
(each protocol's header layout and routing decisions) belongs to each
protocol."""
limitations = """
- No authentication or integrity on anything: a simulation library, not a
  network stack for real radios.
- Downstream protocols build against `main`; there is no release to pin yet."""
verifying = """
Nothing is released yet, so there is nothing to verify. Downstream
repositories build against `main`."""
[make]
build = 'docker run --rm -v "$(CURDIR):/src/swarm-core:ro" $(NS3_IMAGE) ns3-build-contrib swarm-core=/src/swarm-core'
test = 'docker run --rm -v "$(CURDIR):/src/swarm-core:ro" $(NS3_IMAGE) ns3-build-contrib --strict-warnings --test swarm-core=/src/swarm-core'

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (#117).
description = "swarm-core, the shared ns-3 contrib module every swarm-routing protocol links against: simulator-agnostic C++20 primitives (visited path, little-endian wire helpers, pheromone table, route decision, link metrics) and the ns-3 glue they need."
homepage = "https://swarm-routing.github.io/arena/ns3-swarm-core/"
topics = ["ns-3", "swarm-intelligence", "routing-protocol", "manet", "cpp20", "pheromone", "network-simulation", "library"]
ruleset = "protocol"
required_checks = ["ci / ns-latest debug", "ci / ns-latest sanitized", "ci / format", "ci / headers / licence", "check / org-sync", "title / title"]
