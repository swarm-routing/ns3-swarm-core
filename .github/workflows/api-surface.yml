name: API surface

# The public API as a committed, generated record (docs/api-surface.txt) and
# its guard (tools/checks/check-api-surface.py; docs/api-policy.md "The API
# record"): the record must match the sources, and a PR that removes or
# changes a listed item must be marked breaking (`!` in its title or a
# `BREAKING CHANGE:` footer). Strict from the v1.0.0 freeze (#83): a finding
# fails the job, and `api-surface` is a required check ([settings]
# required_checks in .github/org-sync.toml).
# The check name is `api-surface`; no `paths:` filter, so it can become a
# required check without an edit.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: a title that gains or loses its `!`
  merge_group:

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505):
# runners are shared by the whole org. Pushes, merge groups and dispatches run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-surface:
    name: api-surface
    runs-on: ubuntu-latest  # the clang comes from apt below, not the image (#173)
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2
        with:
          egress-policy: audit
      # a docs-only change skips the steps below; the check still reports (swarm-routing/.github#581)
      - uses: swarm-routing/.github/.github/actions/changes@main
        id: changes
        timeout-minutes: 2
        with:
          paths: '\.md$|^docs/references\.bib$|^\.github/ISSUE_TEMPLATE/|^\.github/(CODEOWNERS|FUNDING\.yml|pull_request_template\.md)$|^LICENSE[^/]*$|^CITATION\.cff$|^\.coderabbit\.yaml$|^\.bestpractices\.json$|^\.github/org-sync\.lock$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.docs-only != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0  # the base commit's record
      - name: Self-test
        if: steps.changes.outputs.docs-only != 'true'
        run: python3 -I tools/checks/check-api-surface.py --self-test
      - name: Install the pinned clang
        if: steps.changes.outputs.docs-only != 'true'
        # generate/check need one clang version, so the record never changes
        # with the runner image (#173); the version is the script's CLANG_VERSION.
        timeout-minutes: 8
        run: |
          v=$(python3 -I tools/checks/check-api-surface.py --clang-version)
          for i in 1 2 3; do
            if sudo apt-get update --error-on=any \
              && sudo apt-get install -y --no-install-recommends "clang-$v"; then
              break
            fi
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done
          "clang++-$v" --version
      - name: Pull the ns-3 image
        if: steps.changes.outputs.docs-only != 'true'
        timeout-minutes: 5
        run: docker pull --quiet ghcr.io/swarm-routing/ns3-dev:latest-debug
      - name: Check the record
        if: steps.changes.outputs.docs-only != 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$BASE" ] && git cat-file -e "$BASE:docs/api-surface.txt" 2>/dev/null; then
            git show "$BASE:docs/api-surface.txt" > "$RUNNER_TEMP/base-api-surface.txt"
            args+=(--base-snapshot "$RUNNER_TEMP/base-api-surface.txt")
          fi
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 -I tools/checks/check-api-surface.py check \
            --ns3-image ghcr.io/swarm-routing/ns3-dev:latest-debug \
            --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md" --strict "${args[@]}"
