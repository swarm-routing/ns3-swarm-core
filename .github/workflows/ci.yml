name: CI

# The swarm-core module in ghcr.io/swarm-routing/ns3-dev (debug and sanitized,
# the release ns-3 supports), with every org quality gate on from the first
# PR (swarm-routing/.github#35): strict warnings, coverage (report-only, to Codecov), SonarQube Cloud,
# determinism, clang-format and licence headers.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: JSON list of image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48)'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@main
    with:
      modules: swarm-core=.
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      # Automatic runs: both CI profiles of `latest`. A manual run on older
      # releases defaults to debug, the profile every published release has.
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Strict warnings and coverage need an image whose ns3-build-contrib has the
      # options; on-demand older releases may predate them, so they run on the
      # automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      # SonarQube Cloud CI analysis with that coverage (swarm-routing/.github
      # CONTRIBUTING § Quality gates); skipped on fork PRs (no token) and while
      # the project is on Automatic Analysis.
      sonar: ${{ inputs.ns3-versions == '' }}
      determinism: swarm-core-seed --seed={seed}
      dual-roots: 'core/ tools/'
      core-roots: 'core/'
      # The dev-only microbenchmarks include <benchmark/benchmark.h>, outside
      # the standard library: they are never shipped (LICENSING.md, #45).
      header-exclude: '^core/bench/'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC,
  # no Codecov token).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main

  # The core microbenchmarks (core/bench/, #45): built against Google Benchmark
  # at the commit and archive hash core/CMakeLists.txt pins, run once, the JSON
  # kept as an artifact. Report-only and not a required check: shared runners
  # are too noisy for a gate. PR-vs-base comparison and history on main are
  # swarm-routing/.github#32.
  bench:
    if: inputs.ns3-versions == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (Release)
        run: |
          cmake -S core -B build/bench -DCMAKE_BUILD_TYPE=Release -DSWARM_CORE_BENCH=ON
          cmake --build build/bench -j "$(nproc)" --target swarm_core_bench
      - name: Run
        run: |
          build/bench/swarm_core_bench --benchmark_repetitions=5 \
            --benchmark_report_aggregates_only --benchmark_out=bench.json \
            --benchmark_out_format=json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-bench
          path: bench.json
          retention-days: 7
