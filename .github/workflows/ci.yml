name: CI

# The swarm-core module in ghcr.io/swarm-routing/ns3-dev (debug and sanitized,
# the release ns-3 supports), with every org quality gate on from the first
# PR (swarm-routing/.github#35): strict warnings, coverage (report-only, to Codecov), SonarQube Cloud,
# determinism, clang-format and licence headers.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)
  workflow_dispatch:
    inputs:
      ns3-versions:
        description: 'On demand: JSON list of older ns-3 releases (3.42+), e.g. ["3.48"]'
        default: ''
      profiles:
        description: 'On demand: JSON list of image profiles. Older releases have a debug image; a sanitized one only where it was built on request (e.g. 3.48)'
        default: '["debug"]'

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: swarm-routing/.github/.github/workflows/reusable-ns3-ci.yml@main
    with:
      modules: swarm-core=.
      ns3-versions: ${{ inputs.ns3-versions || '["latest"]' }}
      # Automatic runs: both CI profiles of `latest`. A manual run on older
      # releases defaults to debug, the profile every published release has.
      profiles: ${{ inputs.ns3-versions != '' && inputs.profiles || '["debug", "sanitized"]' }}
      # Strict warnings and coverage need an image whose ns3-build-contrib has the
      # options; on-demand older releases may predate them, so they run on the
      # automatic `latest` legs only.
      strict-warnings: ${{ inputs.ns3-versions == '' }}
      coverage: ${{ inputs.ns3-versions == '' }}
      # SonarQube Cloud CI analysis with that coverage (swarm-routing/.github
      # CONTRIBUTING § Quality gates); skipped on fork PRs (no token) and while
      # the project is on Automatic Analysis.
      sonar: ${{ inputs.ns3-versions == '' }}
      # gcov's exception-edge branches (and those gcovr judges unreachable)
      # are not counted: they made 4303 conditions of 2247 new lines
      # (swarm-routing/.github#425, decision of 2026-11-15).
      coverage-branch-filter: true
      determinism: swarm-core-seed --seed={seed}
      dual-roots: 'core/ tools/'
      core-roots: 'core/'
      # The dev-only microbenchmarks include <benchmark/benchmark.h>, outside
      # the standard library: they are never shipped (LICENSING.md, #45).
      header-exclude: '^core/bench/'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # core/ keeps up with the C++ standard of the ns-3 release swarm-core
  # supports (docs/api-policy.md "C++ standard", #141): core/CMakeLists.txt's
  # CMAKE_CXX_STANDARD and the cxx_std_ feature a consumer inherits against
  # the CMAKE_CXX_STANDARD_MINIMUM of the image the `ci` job builds in. Fails
  # when ns-3 raises its minimum and core/ has not followed.
  cxx-standard:
    if: inputs.ns3-versions == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ghcr.io/swarm-routing/ns3-dev:latest-debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test
        run: python3 -I tools/checks/check-cxx-standard.py --self-test
      - name: core/ against the image's ns-3
        run: python3 -I tools/checks/check-cxx-standard.py --ns3 /opt/ns-3 core/CMakeLists.txt

  # The coverage report of the `ci` job to Codecov (report-only; GitHub OIDC,
  # no Codecov token).
  codecov:
    needs: ci
    if: inputs.ns3-versions == ''
    permissions:
      contents: read
      id-token: write
    uses: swarm-routing/.github/.github/workflows/reusable-codecov.yml@main

  # The core microbenchmarks (core/bench/, #45). On a PR (#170): the base and
  # the head built on the same runner, run interleaved three times each, and
  # the median CPU time per benchmark compared by tools/bench/bench_compare.py
  # (the head is the PR's merge commit, so the delta is the PR's change alone):
  # the table in the job summary and in one PR comment (updated in place), a
  # ::warning:: for a benchmark more than 15 % slower. On main and in the merge
  # queue: the head alone. Report-only and not a required check: shared runners
  # are too noisy for a gate. Each side runs its own core/bench/ source.
  bench:
    if: inputs.ns3-versions == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # A newer push to the PR cancels this run, so an older run never
    # overwrites a newer comparison in the comment.
    concurrency:
      group: bench-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write  # the delta comment (same-repository PRs only)
    env:
      BENCH_ARGS: --benchmark_repetitions=3 --benchmark_min_time=0.2s --benchmark_out_format=json
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The comparison script's self-test
        run: python3 -I tools/bench/bench_compare.py --self-test
      - name: Build the head (Release)
        run: |
          cmake -S core -B "$RUNNER_TEMP/head" -DCMAKE_BUILD_TYPE=Release -DSWARM_CORE_BENCH=ON
          cmake --build "$RUNNER_TEMP/head" -j "$(nproc)" --target swarm_core_bench
      - name: Build the base (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base-src" "$BASE"
          if [ ! -f "$RUNNER_TEMP/base-src/core/bench/swarm-core-bench.cc" ]; then
            echo "The base has no core/bench; every row is new."
            echo "NO_BASE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          cmake -S "$RUNNER_TEMP/base-src/core" -B "$RUNNER_TEMP/base" -DCMAKE_BUILD_TYPE=Release -DSWARM_CORE_BENCH=ON
          cmake --build "$RUNNER_TEMP/base" -j "$(nproc)" --target swarm_core_bench
      - name: Run, base and head interleaved
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p bench
          rounds=1
          [ "$EVENT" != pull_request ] || rounds=3
          for i in $(seq "$rounds"); do
            if [ "$EVENT" = pull_request ] && [ -z "${NO_BASE:-}" ]; then
              # shellcheck disable=SC2086  # BENCH_ARGS is a list of flags
              "$RUNNER_TEMP/base/swarm_core_bench" $BENCH_ARGS --benchmark_out="bench/base-$i.json" > /dev/null
            fi
            # shellcheck disable=SC2086
            "$RUNNER_TEMP/head/swarm_core_bench" $BENCH_ARGS --benchmark_out="bench/head-$i.json" > /dev/null
          done
      - name: Compare against the base (PR only)
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          shopt -s nullglob
          python3 -I tools/bench/bench_compare.py compare --threshold 15 \
            --base bench/base-*.json --head bench/head-*.json --markdown bench/delta.md
          {
            cat bench/delta.md
            echo
            echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//'). Head: the merge of $HEAD_SHA into the base ($MERGE_SHA); base $BASE_SHA."
          } > bench/comment.md
          cat bench/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the delta comment (PR from this repository only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true  # report-only: a failed comment never fails the job
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- swarm-core-bench-delta -->'
          printf '%s\n%s' "$marker" "$(cat bench/comment.md)" > bench/body.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@bench/body.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@bench/body.md > /dev/null
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-bench
          path: bench/
          retention-days: 7
